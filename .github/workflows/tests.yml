name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        exclude:
          # O Laravel 13 exige PHP 8.3+.
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, zip, zlib
          coverage: none

      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Instalar dependencias
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Versoes instaladas
        run: composer show laravel/framework orchestra/testbench phpunit/phpunit | grep -E "^(name|versions)"

      - name: Testes
        run: vendor/bin/phpunit
        env:
          BACKUP_TEST_DB_PASSWORD: root

  guzzle-versions:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        guzzle: ['^7.15.2', '^8.0.1']

    name: Guzzle ${{ matrix.guzzle }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zlib
          coverage: none

      - name: Instalar dependencias
        run: |
          composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Versao instalada
        run: composer show guzzlehttp/guzzle | grep -E "^(name|versions)"

      - name: Testes
        run: vendor/bin/phpunit --testsuite Unit,Feature

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
